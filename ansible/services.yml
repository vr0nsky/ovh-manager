# -----------------------------------------------------------------------------
# TOOL / UTILITY
# -----------------------------------------------------------------------------

phpmyadmin:
  name: phpMyAdmin
  category: Tool
  desc: UI web per MySQL/MariaDB
  tasks:
    - name: Installa phpMyAdmin
      ansible.builtin.apt:
        name: phpmyadmin
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive

adminer:
  name: Adminer
  category: Tool
  desc: UI web leggera per database (1 file PHP)
  tasks:
    - name: Crea directory adminer
      ansible.builtin.file:
        path: /var/www/html/adminer
        state: directory
    - name: Scarica Adminer
      ansible.builtin.get_url:
        url: "https://www.adminer.org/latest.php"
        dest: /var/www/html/adminer/index.php

minio:
  name: MinIO
  category: Tool
  desc: Object storage S3-compatibile
  tasks:
    - name: Scarica MinIO
      ansible.builtin.get_url:
        url: "https://dl.min.io/server/minio/release/linux-amd64/minio"
        dest: /usr/local/bin/minio
        mode: "0755"
    - name: Crea directory dati MinIO
      ansible.builtin.file:
        path: /data/minio
        state: directory
    - name: Crea servizio systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system/minio.service
        content: |
          [Unit]
          Description=MinIO
          After=network.target
          [Service]
          Environment="MINIO_ROOT_USER=minioadmin"
          Environment="MINIO_ROOT_PASSWORD=minioadmin"
          ExecStart=/usr/local/bin/minio server /data/minio --console-address ":9001"
          Restart=always
          [Install]
          WantedBy=multi-user.target
    - name: Avvia e abilita MinIO
      ansible.builtin.service:
        name: minio
        state: started
        enabled: true
        daemon_reload: true
